<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Takip - Çok Yakında!</title>
    <style>
        /* Genel Sayfa Ayarları */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #060214 100%);
            overflow: hidden;
            position: relative;
        }

        /* Arka Plan Süs Efektleri */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            opacity: 0.4;
        }

        body::before {
            background: #00d2ff;
            top: 10%;
            left: 15%;
            animation: float 6s ease-in-out infinite alternate;
        }

        body::after {
            background: #7000ff;
            bottom: 10%;
            right: 15%;
            animation: float 6s ease-in-out infinite alternate-reverse;
        }

        /* Şekilli Cam Kart Konteyneri */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3.5rem 4rem;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 550px;
            width: 90%;
            animation: fadeIn 1.5s ease-out;
        }

        /* Logo / İkon Alanı */
        .box-icon {
            font-size: 3.8rem;
            margin-bottom: 0.5rem;
            display: inline-block;
            animation: pulse 2s infinite;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.5));
        }

        /* BÜYÜK STOK TAKİP BAŞLIĞI */
        .main-title {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.3),
                         0 0 20px rgba(0, 210, 255, 0.2);
            margin-bottom: 0.2rem;
            line-height: 1.1;
        }

        /* Çok Yakında Alt Başlığı (Animasyonlu Gradient) */
        .sub-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #00d2ff, #7000ff, #00d2ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            margin-bottom: 1.5rem;
        }

        /* Açıklama Metni */
        p {
            color: rgba(255, 255, 255, 0.65);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* İlerleme Çubuğu */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #7000ff);
            border-radius: 10px;
            animation: load 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Alt Bilgi Notu */
        .footer-text {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 1px;
        }

        /* Animasyon Tanımlamaları */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(25px) scale(1.05); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        @keyframes load {
            from { width: 0%; }
            to { width: 78%; } /* Yüklenme barının duracağı yüzde */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Stok/Depo temasına uygun kutu ikonu -->
        <div class="box-icon">📦</div>
        
        <!-- Büyük Stok Takip Yazısı -->
        <div class="main-title">STOK TAKİP</div>
        
        <!-- Şekilli Çok Yakında Yazısı -->
        <div class="sub-title">ÇOK YAKINDA</div>
        
        <p>Gelişmiş stok yönetimi, anlık takip ve akıllı raporlama çözümlerimizle süreçlerinizi kolaylaştırmaya geliyoruz. Takipte kalın!</p>
        
        <div class="progress-bar-container">
            <div class="progress-bar"></div>
        </div>

        <div class="footer-text">Sistem entegrasyonu devam ediyor...</div>
    </div>

</body>
</html>
